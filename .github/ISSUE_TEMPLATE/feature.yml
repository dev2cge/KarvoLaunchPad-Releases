name: Feature or usability feedback
description: Suggest an improvement to Karvo
title: "[Feedback] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the current difficulty and the outcome you want.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Minecraft and client versions, if relevant
